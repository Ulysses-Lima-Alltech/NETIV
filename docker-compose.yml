services:
  postgres:
    image: postgres:16-alpine
    container_name: netiv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: netiv
    ports:
      - "5432:5432"
    volumes:
      - netiv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

# Nota: em produção (Render) sem Persistent Disk, os arquivos de empreendimento
# são preservados via coluna file_data BYTEA no PostgreSQL (migration 027).
# Em dev local, este volume garante persistência entre restarts do container do server.
# Se rodar o server em Node diretamente (sem container), o diretório
# storage/empreendimentos/ no monorepo já persiste naturalmente.
volumes:
  netiv_pgdata:
  netiv_storage:
